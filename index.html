<script>
  function toggleMenu() {
    document.getElementById("navMenu").classList.toggle("active");
  }

<script>
  function resizeGrid() {
    const grid = document.querySelectorAll('.portfolio-container');

    grid.forEach(container => {
      const items = container.querySelectorAll('.image');

      items.forEach(item => {
        const imgHeight = item.querySelector('img').getBoundingClientRect().height;
        item.style.gridRowEnd = `span ${Math.ceil(imgHeight + 24)}`;
      });
    });
  }

  window.addEventListener('load', resizeGrid);
  window.addEventListener('resize', resizeGrid);
</script>
